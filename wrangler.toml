name = "akashic-wealth"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Once the domain is on your Cloudflare account, set workers_dev = false and uncomment:
# routes = [
#   { pattern = "www.your-domain.com", custom_domain = true }
# ]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/", "/go/*", "/stats", "/signup", "/signups.csv"]

[[d1_databases]]
binding = "DB"
database_name = "akashic-stats"
database_id = "PASTE_THE_ID_FROM_wrangler_d1_create"
